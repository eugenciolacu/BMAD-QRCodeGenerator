services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  webapp:
    build:
      context: "./QR code Generator App"
      dockerfile: QRCodeGeneratorApp/dockerfile
    container_name: webapp
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MyDatabase;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  playwright:
    build:
      context: "./QRCodeGeneratorApp.TS.Tests"
      dockerfile: Dockerfile
    container_name: playwright-e2e
    depends_on:
      webapp:
        condition: service_healthy # Wait for webapp to be ready
    environment:
      - BASE_URL=http://webapp:8080
    volumes:
      - ./QRCodeGeneratorApp.TS.Tests/playwright-report:/app/playwright-report
      - ./QRCodeGeneratorApp.TS.Tests/test-results:/app/test-results
    # This prevents the container from exiting immediately if you want to exec into it
    tty: true          # This simulates a terminal
    stdin_open: true   # This keeps the input stream open
    ports:
      - "9323:9323"

volumes:
  sqlserver_data:
  app_logs: