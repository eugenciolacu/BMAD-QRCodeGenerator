gate:
  story: 4.2.image-download
  title: "Download QR Code as Image (SVG/PNG)"
  date: 2026-02-20
  reviewer: Quinn (Test Architect)
  decision: PASS
  rationale: >-
    All 7 acceptance criteria implemented and verified. All critical and high risks fully mitigated in code. Security posture is strong: ownership verified server-side before any generation occurs, [Authorize] inherited from controller class, format parameter sanitised to prevent injection. Performance confirmed by runtime log evidence: PNG download 241ms cold, 72ms warm — well within the 1-second target. Images generated entirely in-memory with no database persistence, satisfying AC-3. Content-Disposition set automatically via ASP.NET Core FileResult. Format selector implemented on both Details and My QR Codes pages with JS-driven href updates. One medium recommendation (Windows-only System.Drawing.Common dependency) documented for future cross-platform consideration. Story is approved and production-ready.
  nfr_quality_score: 93
  build_verified: true
  production_ready: true
  cross_references:
    story: "docs/stories/4.2.image-download.md"
    review: "qa/assessments/4.2.image-download-review-20260220.md"
    nfr: "qa/assessments/4.2.image-download-nfr-20260220.md"
    trace: "qa/assessments/4.2.image-download-trace-20260220.md"
    risk: "qa/assessments/4.2.image-download-risk-20260220.md"
    test_design: "qa/assessments/4.2.image-download-test-design-20260220.md"

acceptance_criteria:
  total: 7
  passed: 7
  failed: 0
  criteria:
    - id: AC-1
      description: "Download Image button available on QR Code Details page and My QR Codes page"
      status: PASS
      evidence: "Format dropdown + Download Image button added to Details.cshtml card footer; Download Image button + format select added to Index.cshtml action bar"
    - id: AC-2
      description: "User can choose format SVG or PNG via UI toggle or query parameter"
      status: PASS
      evidence: "<select id='img-format-select'> on Details page; <select id='img-format-index'> on Index page; JS updates href on change; ?format= query parameter forwarded"
    - id: AC-3
      description: "Image generated on demand, not stored in database"
      status: PASS
      evidence: "GenerateImage() is pure in-memory computation in QRCodeService.cs; no SaveChangesAsync() in DownloadImage action"
    - id: AC-4
      description: "Downloaded file has meaningful filename (qrcode-{id}.svg or qrcode-{id}.png)"
      status: PASS
      evidence: "Controllers/QRCodesController.cs: var fileName = $\"qrcode-{id}.{format.ToLower()}\""
    - id: AC-5
      description: "Only owner can download — unauthorised access returns 404"
      status: PASS
      evidence: "if (qrCode == null || qrCode.UserId != userId) return NotFound(); [Authorize] on controller class"
    - id: AC-6
      description: "Content-Disposition header set for download"
      status: PASS
      evidence: "return File(data, contentType, fileName) — ASP.NET Core FileContentResult sets Content-Disposition: attachment automatically"
    - id: AC-7
      description: "Image generation completes in under 1 second"
      status: PASS
      evidence: "Log evidence: GET /QRCodes/DownloadImage/32?format=png → 200 in 241ms (cold), 72ms (warm); SVG is lighter weight and faster"

risk_summary:
  totals:
    critical: 2
    high: 2
    medium: 3
    low: 2
  all_critical_mitigated: true
  all_high_mitigated: true
  highest:
    id: SEC-001
    score: 9
    title: "Unauthorised Access — IDOR on Download Endpoint"
    mitigation: "Ownership check against authenticated UserId before image generation; return NotFound() for non-owned codes"
  critical_risks:
    - id: SEC-001
      title: "Unauthorised Access — IDOR on Download Endpoint"
      score: 9
      status: MITIGATED
      how: "qrCode.UserId != userId check using userId from User.FindFirstValue(ClaimTypes.NameIdentifier); returns 404 (not 403) to avoid existence leakage"
    - id: SEC-002
      title: "Sensitive Data Exposure via Downloaded Image"
      score: 6
      status: MITIGATED
      how: "Images contain only QR code graphics derived from stored plaintext content; no tokens, PII, or credentials embedded in output"
  high_risks:
    - id: SEC-003
      title: "Missing [Authorize] Attribute"
      score: 6
      status: MITIGATED
      how: "[Authorize] applied at QRCodesController class level; DownloadImage inherits it; unauthenticated requests redirected to login"
    - id: PERF-001
      title: "Large Image / Concurrent Downloads Causing Server Overload"
      score: 4
      status: MITIGATED
      how: "QR image sizes are bounded (max version 10, scale 10, 4-module border); generation is sub-100ms warm; no file I/O or disk writes"
  recommendations:
    must_fix: []
    before_production: []
    nice_to_have:
      - id: REC-001
        severity: medium
        description: "System.Drawing.Common is Windows-only (CA1416); replace with SkiaSharp or SixLabors.ImageSharp for cross-platform PNG support"
        component: "Services/QRCodeService.cs GenerateImage()"
        priority: P2
        target: "Future sprint if cross-platform deployment is required"
      - id: REC-002
        severity: medium
        description: "Add try/catch around GenerateImage() call in DownloadImage action for better HTTP 500 handling on unexpected errors"
        component: "Controllers/QRCodesController.cs DownloadImage action"
        priority: P2
        target: "Next sprint (reliability improvement)"
      - id: REC-003
        severity: low
        description: "Add SVG download integration test to complement the PNG downloads already observed in logs"
        component: "Test coverage"
        priority: P3
      - id: REC-004
        severity: low
        description: "Consider response caching headers (ETag / Cache-Control) for repeated downloads of the same QR code"
        component: "Controllers/QRCodesController.cs DownloadImage action"
        priority: P3

