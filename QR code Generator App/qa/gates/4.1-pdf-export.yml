      title: "Add try/catch around GeneratePdf()"
      description: "Wrap _pdfExportService.GeneratePdf() in try/catch; log at Error level; return user-friendly error (redirect with TempData message)"
      priority: P1
      sprint: "Next sprint as reliability hardening"
      blocking: false
  low_priority:
    - id: REC-2
      title: "Custom error page for PDF generation failure"
      description: "Implement user-friendly error response (redirect to Details with TempData message) instead of generic 500"
      priority: P2
    - id: REC-3
      title: "Secrets management for production deployment"
      description: "Use User Secrets (dev) or Key Vault (prod); applies to entire app"
      priority: P2
    - id: REC-4
      title: "Extract MIME type to constants"
      description: "Replace inline 'application/pdf' with MediaTypeNames.Application.Pdf"
      priority: P3

